route:
  receiver: "default"
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: "default"
    email_configs:
      - to: "deepakpundir@365aitech.com"
        from: "${SMTP_FROM}"
        smarthost: "${SMTP_HOST}:${SMTP_PORT}"
        auth_username: "${SMTP_USERNAME}"
        auth_password: "${SMTP_PASSWORD}"
        require_tls: true
