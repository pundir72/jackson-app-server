groups:
  - name: sre-alerts
    rules:
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[5m])) by (le)) > 1000
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High p95 latency"
          description: "p95 latency > 1s for more than 2 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_total{http_status_code=~\"5..\"}[5m]))
            /
            sum(rate(http_server_requests_total[5m]))
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "High 5xx error rate"
          description: "5xx error rate > 2% over 5 minutes."

      - alert: ContainerRestartingFrequently
        expr: |
          changes(container_start_time_seconds{container_label_com_docker_compose_service=\"sre_app\"}[10m]) > 2
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Container restarting frequently"
          description: "SRE app container restarted more than 2 times in 10 minutes."

      - alert: HighNodeMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High node memory usage"
          description: "Node memory usage > 85% for 5 minutes."
